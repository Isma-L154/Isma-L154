<svg xmlns="http://www.w3.org/2000/svg" width="410" height="320" viewBox="0 0 410 320" role="img" aria-label="Ismael Leon - DevOps and Cloud Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0E11"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151920"/>
      <stop offset="1" stop-color="#0F1216"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1.05" r="0.85">
      <stop offset="0" stop-color="#39D353" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#39D353" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="409" height="319" rx="14" fill="url(#bg)" stroke="#242932" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="409" height="319" rx="14" fill="url(#glow)"/>

  <!-- title bar -->
  <path d="M0.5,14.5 A14,14 0 0 1 14.5,0.5 H395.5 A14,14 0 0 1 409.5,14.5 V40.5 H0.5 Z" fill="url(#bar)"/>
  <line x1="0.5" y1="40.5" x2="409.5" y2="40.5" stroke="#242932" stroke-width="1"/>
  <circle cx="24" cy="20.5" r="5.5" fill="#FF5F57"/>
  <circle cx="43" cy="20.5" r="5.5" fill="#FFBD2E"/>
  <circle cx="62" cy="20.5" r="5.5" fill="#28C840"/>
  <text x="88" y="25" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="11" fill="#5A616C" letter-spacing="1">ismael@portfolio</text>

  <!-- line 1 -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;0.30" dur="3.6s" fill="freeze"/>
    <text x="26" y="82" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#39D353">$</text>
    <text x="44" y="82" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#8B939E">whoami</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.14;0.34" dur="3.6s" fill="freeze"/>
    <text x="26" y="112" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="23" font-weight="bold" fill="#E8EBEF">Ismael Le&#243;n</text>
  </g>

  <!-- line 2 -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.34;0.52" dur="3.6s" fill="freeze"/>
    <text x="26" y="156" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#39D353">$</text>
    <text x="44" y="156" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#8B939E">cat role.txt</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.44;0.60" dur="3.6s" fill="freeze"/>
    <text x="26" y="184" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="16" font-weight="bold" fill="#39D353">DevOps &amp; Cloud Engineer</text>
  </g>

  <!-- line 3 -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.60;0.76" dur="3.6s" fill="freeze"/>
    <text x="26" y="228" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#39D353">$</text>
    <text x="44" y="228" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#8B939E">locate me</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.70;0.86" dur="3.6s" fill="freeze"/>
    <text x="26" y="256" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#B6BCC4">San Jos&#233;, Costa Rica</text>
  </g>

  <!-- prompt + blinking cursor -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.86;0.96" dur="3.6s" fill="freeze"/>
    <text x="26" y="292" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#39D353">$</text>
    <rect x="44" y="281" width="9" height="15" fill="#39D353">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
