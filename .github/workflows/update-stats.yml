name: Update README cards

# The README used to pull its cards from shared third party instances, which kept
# answering "Cards are temporarily rate limited" (issue #1). The cards are rendered
# here instead and committed to assets/, so the README only ever loads static files.

on:
  schedule:
    - cron: "17 5 * * *" # every day at 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-stats.mjs
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render cards
        env:
          # STATS_TOKEN is optional: a personal access token also counts private
          # contributions. Without it the built-in token renders the public ones.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "Cards are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh README stat cards"
          git push
